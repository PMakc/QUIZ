<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ — Алхимик</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="shell"><div class="panel" id="admin"><div class="eyebrow">АДМИН-ПАНЕЛЬ</div><h1>Квиз «Алхимик»</h1><p>45 секунд на каждый вопрос. Управление: старт → показать ответ → следующий.</p><div class="toolbar"><button class="btn" onclick="startQuiz()">Старт / новый раунд</button><button class="btn ghost" onclick="advance()">Далее / показать ответ</button><button class="btn danger" onclick="resetQuiz()">Сбросить</button></div><div class="room"><span>Код комнаты:</span><strong id="room">—</strong></div><div class="urls"><div>Игроки: <code id="playUrl">—</code></div><div>Экран: <code id="screenUrl">—</code></div></div><div class="grid"><section><h2 id="status">Ожидание</h2><div id="question"></div></section><section><h2>Команды</h2><div id="scores"></div></section></div></div></main><script>
async function api(url, options){const r=await fetch(url, options); const d=await r.json(); if(!r.ok) throw new Error(d.message||'Ошибка'); return d;}
async function refresh(){try{const d=await api('/api/state'); const s=d.state; document.getElementById('room').textContent=s.room_code; document.getElementById('playUrl').textContent=location.origin+'/play?code='+encodeURIComponent(s.room_code); document.getElementById('screenUrl').textContent=location.origin+'/screen?code='+encodeURIComponent(s.room_code); let label=s.phase==='waiting'?'Ожидание':s.phase==='question'?'Вопрос':'Открытие ответа'; if(s.phase==='finished') label='Квиз завершён'; document.getElementById('status').textContent=label; const q=d.question; if(q){document.getElementById('question').innerHTML='<div class="qnum">Вопрос '+(s.q_index+1)+' / 17 · раунд '+q.round+'</div><div class="question">'+esc(q.question)+'</div>'+(q.answer?'<div class="answer">Ответ: '+esc(q.answer)+'</div><div class="muted">'+esc(q.explanation||'')+'</div>':'');} else document.getElementById('question').innerHTML=''; const sc=await api('/api/scores'); document.getElementById('scores').innerHTML=sc.teams.map((x,i)=>'<div class="score"><span>'+(i+1)+'. '+esc(x.team_name)+'</span><b>'+x.score+'</b></div>').join('')||'<div class="muted">Команды ещё не подключились.</div>'; }catch(e){console.error(e)}}
async function startQuiz(){await api('/api/admin/start',{method:'POST'}); await refresh();}
async function advance(){await api('/api/admin/advance',{method:'POST'}); await refresh();}
async function resetQuiz(){await api('/api/admin/reset',{method:'POST'}); await refresh();}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
refresh(); setInterval(refresh,1000);
</script></body></html>
