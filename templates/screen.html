<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ settings.title }} — экран</title><link rel="stylesheet" href="/static/style.css"></head><body class="screen-page"><main class="stage"><header class="stage-head"><div><div class="eyebrow">{{ settings.subtitle }}</div><h1>{{ settings.title }}</h1></div><div class="stage-code"><small>КОД</small><b id="room">—</b></div></header><section id="stageGame" class="stage-game"><div id="phase" class="stage-phase">ЖДЁМ ИГРОКОВ</div><div id="round" class="stage-round"></div><h2 id="qtext">Сканируйте QR-код и подключайтесь</h2><div id="qimage"></div><div id="options" class="stage-options"></div><div id="stats" class="stage-stats"></div><div id="explanation" class="stage-explanation" hidden></div><div id="timer" class="stage-timer">—</div></section><aside class="join-card"><div>СКАНИРУЙТЕ ДЛЯ ВХОДА</div><img id="qr"><b id="joinCode">—</b><small id="joinUrl">—</small></aside><div id="reactions" class="reaction-layer"></div><div class="reaction-counts"><span>👍 <b id="rc-👍">0</b></span><span>😊 <b id="rc-😊">0</b></span><span>❤️ <b id="rc-❤️">0</b></span><span>🔥 <b id="rc-🔥">0</b></span></div><section id="finish" class="finish" hidden><div class="eyebrow">ИТОГИ</div><h2>Результаты</h2><div id="podium" class="podium"></div><div id="board" class="board"></div></section></main><script>
const $=id=>document.getElementById(id);let lastReaction=0;let lastQid=null,lastPhase=null;
async function api(u){const r=await fetch(u);return r.json()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showStats(stats,q,s){const box=$('stats');box.innerHTML='';if(!stats||!stats.total||!q||!q.options?.length)return;box.innerHTML=stats.options.map(o=>{const correct=s.phase!=='question'&&Array.isArray(q.answer)?q.answer.includes(o.option):(s.phase!=='question'&&q.answer===o.option);return `<div class="stat-line"><span>${esc(o.option)}</span><div class="bar"><i style="width:${o.percent}%"></i></div><b>${o.percent}%</b></div>`}).join('')}
function render(d){const s=d.state,q=d.question;$('room').textContent=s.room_code;$('joinCode').textContent=s.room_code;const url=location.origin+'/play?code='+s.room_code;$('joinUrl').textContent=url;$('qr').src='/api/qr?url='+encodeURIComponent(url)+'&t='+Date.now();for(const e of ['👍','😊','❤️','🔥'])$('rc-'+e).textContent=d.reaction_counts?.[e]||0;if(s.phase==='finished'){showFinish(d.leaderboard);return}$('finish').hidden=true;$('stageGame').style.display='flex';if(!q){$('phase').textContent='ЖДЁМ ИГРОКОВ';$('round').textContent='';$('qtext').textContent='Сканируйте QR-код и подключайтесь';$('qimage').innerHTML='';$('options').innerHTML='';$('stats').innerHTML='';$('explanation').hidden=true;$('timer').textContent='—';return}$('phase').textContent=s.phase==='question'?'ОТВЕЧАЙТЕ':'ПРАВИЛЬНЫЙ ОТВЕТ';$('round').textContent='Раунд '+q.round_position+' · '+q.round_title+' · Вопрос '+q.position;$('qtext').textContent=q.text;$('qimage').innerHTML=q.image?`<img class="screen-image" src="/media/${q.image}">`:'';const answers=Array.isArray(q.answer)?q.answer:[q.answer];$('options').innerHTML=(q.options||[]).map((o,i)=>{const isCorrect=s.phase!=='question'&&answers.map(String).includes(String(o));return `<div class="stage-option ${isCorrect?'correct':''}"><span>${String.fromCharCode(65+i)}</span><b>${esc(o)}</b></div>`}).join('');showStats(s.phase==='question'&&lastQid===q.id?d.stats:d.stats,q,s);if(s.phase!=='question'&&q.answer){$('explanation').hidden=false;$('explanation').innerHTML='<strong>Правильный ответ:</strong> '+esc(Array.isArray(q.answer)?q.answer.join(', '):q.answer)+'<p>'+esc(q.explanation||'')+'</p>'}else $('explanation').hidden=true;$('timer').textContent=s.phase==='question'?Math.max(0,Math.ceil((s.deadline*1000-Date.now())/1000))+'с':'ОТВЕТ';lastQid=q.id;lastPhase=s.phase}
function showFinish(list){$('stageGame').style.display='none';$('finish').hidden=false;$('podium').innerHTML=list.slice(0,3).map((x,i)=>`<div class="podium-card"><small>#${i+1}</small><b>${esc(x.team_name)}</b><strong>${x.score}</strong></div>`).join('');$('board').innerHTML=list.map((x,i)=>`<div class="board-row"><span>#${i+1}</span><b>${esc(x.team_name)}</b><strong>${x.score}</strong></div>`).join('')}
async function poll(){try{const d=await api('/api/state');render(d);const rr=await api('/api/reactions?since='+lastReaction);for(const r of rr.reactions){lastReaction=r.id;const n=document.createElement('div');n.className='reaction-float';n.textContent=r.emoji;n.style.setProperty('--dx',(Math.random()*120-60)+'px');$('reactions').appendChild(n);setTimeout(()=>n.remove(),1500)}for(const e of ['👍','😊','❤️','🔥'])$('rc-'+e).textContent=rr.counts?.[e]||0}catch(e){console.error(e)}}poll();setInterval(poll,700);setInterval(async()=>{const d=await api('/api/state');if(d.state.phase==='question')$('timer').textContent=Math.max(0,Math.ceil((d.state.deadline*1000-Date.now())/1000))+'с'},200)
</script></body></html>
