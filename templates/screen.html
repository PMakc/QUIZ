<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Общий экран — Алхимик</title><link rel="stylesheet" href="/static/style.css"></head><body class="screen-body">
<main class="stage"><div class="stage-bg"></div><header class="stage-header"><div class="brand"><div class="brand-mark small">A</div><div><strong>АЛХИМИК</strong><span>СИНДРОМ ЭФИРИТА</span></div></div><div class="stage-code"><span>КОД КВИЗА</span><b id="room">—</b></div></header>
<section id="content" class="stage-content"><div class="eyebrow" id="phase">ЖДЁМ ИГРОКОВ</div><div id="round" class="stage-round"></div><h1 id="question">Подключайтесь по QR-коду</h1><div id="options" class="stage-options"></div><div id="explanation" class="stage-explanation" hidden></div><div class="stage-timer" id="timer">—</div></section>
<aside class="join-card"><div class="join-title">Подключиться</div><img id="qr" alt="QR код для подключения"><div class="join-code" id="joinCode">—</div><div class="join-url" id="joinUrl">—</div></aside>
<div id="reactions" class="reaction-layer"></div>
<div id="leaderboard" class="leaderboard-stage" hidden><div class="eyebrow">ИТОГИ</div><h2>Результаты квиза</h2><div id="podium"></div><div id="topList"></div></div>
</main>
<script>
let lastReaction=0;const TOTAL={{ question_count }};
async function api(url){const r=await fetch(url);return r.json()}
function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function renderLeaderboard(list){const top=list.slice(0,3);const podium=['second','first','third'];document.getElementById('podium').innerHTML=top.map((x,i)=>'<div class="podium '+podium[i]+'"><span>#'+(i+1)+'</span><strong>'+esc(x.team_name)+'</strong><b>'+x.score+'</b></div>').join('');document.getElementById('topList').innerHTML=list.map((x,i)=>'<div class="stage-score"><span>#'+(i+1)+'</span><strong>'+esc(x.team_name)+'</strong><b>'+x.score+'</b></div>').join('')}
function renderQuestion(d){const s=d.state,q=d.question;document.getElementById('room').textContent=s.room_code;document.getElementById('joinCode').textContent=s.room_code;const join=location.origin+'/play?code='+encodeURIComponent(s.room_code);document.getElementById('joinUrl').textContent=join;document.getElementById('qr').src='/api/qr?code='+encodeURIComponent(join)+'&t='+Date.now();const phase=document.getElementById('phase');const qel=document.getElementById('question');const opts=document.getElementById('options');const exp=document.getElementById('explanation');const board=document.getElementById('leaderboard');board.hidden=s.phase!=='finished';document.getElementById('content').style.display=s.phase==='finished'?'none':'flex';if(s.phase==='finished'){renderLeaderboard(d.leaderboard);return;}if(!q){phase.textContent='ЖДЁМ ИГРОКОВ';document.getElementById('round').textContent='';qel.textContent='Подключайтесь по QR-коду';opts.innerHTML='';exp.hidden=true;document.getElementById('timer').textContent='—';return;}phase.textContent=s.phase==='question'?'РАУНД '+q.round:s.phase==='reveal'?'ПРОВЕРЯЕМ ОТВЕТ':'РАУНД '+q.round;document.getElementById('round').textContent=q.title+' · Вопрос '+(s.q_index+1)+' / '+TOTAL;qel.textContent=q.question;opts.innerHTML='';if(q.options?.length){q.options.forEach((x,i)=>{const letter=String.fromCharCode(65+i);const correct=q.answer&&x===q.answer;opts.innerHTML+='<div class="stage-option '+(correct&&s.phase==='reveal'?'correct':'')+'"><span>'+letter+'</span><strong>'+esc(x)+'</strong></div>'})}if(s.phase==='reveal'&&q.answer){exp.hidden=false;exp.innerHTML='<b>Правильный ответ: '+esc(q.answer)+'</b><div>'+esc(q.explanation||'')+'</div>'}else{exp.hidden=true}document.getElementById('timer').textContent=s.phase==='question'?Math.max(0,Math.ceil(s.deadline-Date.now()/1000))+'с':s.phase==='reveal'?'ОТВЕТ':''}
async function poll(){try{const d=await api('/api/state');renderQuestion(d);const rr=await api('/api/reactions?since='+lastReaction);for(const r of rr.reactions){lastReaction=r.id;const node=document.createElement('div');node.className='reaction-float';node.textContent=r.emoji;document.getElementById('reactions').appendChild(node);setTimeout(()=>node.remove(),1600)}}catch(e){}}
poll();setInterval(poll,700);setInterval(()=>api('/api/state').then(d=>{if(d.state.phase==='question')document.getElementById('timer').textContent=Math.max(0,Math.ceil(d.state.deadline-Date.now()/1000))+'с'}),150)
</script></body></html>
