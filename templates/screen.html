<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Экран — {{ settings.title }}</title><link rel="stylesheet" href="/static/style.css"></head><body class="screen"><main class="stage"><header class="stage-top"><div><div class="eyebrow">{{ settings.subtitle }}</div><h1>{{ settings.title }}</h1></div><div class="stage-code"><span>КОД</span><b id="room">—</b></div></header><section id="game" class="screen-game"><div id="phase" class="screen-phase">ЖДЁМ ИГРОКОВ</div><div id="round" class="screen-round"></div><div id="qtext" class="screen-question">Сканируйте QR-код и подключайтесь</div><div id="qimage"></div><div id="options" class="screen-options"></div><div id="explanation" class="screen-explanation" hidden></div><div id="timer" class="screen-timer">—</div></section><aside class="join-float"><div class="join-title">Сканируйте, чтобы войти</div><img id="qr" alt="QR"><b id="joinCode">—</b><small id="joinUrl">—</small></aside><div id="reactionLayer" class="reaction-layer"></div><div class="reaction-counts"><span>👍 <b id="rc-👍">0</b></span><span>😊 <b id="rc-😊">0</b></span><span>❤️ <b id="rc-❤️">0</b></span><span>🔥 <b id="rc-🔥">0</b></span></div><section id="finish" class="finish-screen" hidden><div class="eyebrow">ИТОГИ</div><h2>Победители</h2><div id="podium" class="podium"></div><div id="fullBoard" class="full-board"></div></section></main>
<script>
let lastReaction=0;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(u){const r=await fetch(u);return r.json()}
function showQuestion(d){const s=d.state,q=d.question;$('room').textContent=s.room_code;$('joinCode').textContent=s.room_code;const join=location.origin+'/play?code='+s.room_code;$('joinUrl').textContent=join;$('qr').src='/api/qr?url='+encodeURIComponent(join)+'&t='+Date.now();if(s.phase==='finished'){showFinish(d.leaderboard);return}$('finish').hidden=true;$('game').style.display='flex';if(!q){$('phase').textContent='ЖДЁМ ИГРОКОВ';$('round').textContent='';$('qtext').textContent='Сканируйте QR-код и подключайтесь';$('qimage').innerHTML='';$('options').innerHTML='';$('explanation').hidden=true;$('timer').textContent='—';return}$('phase').textContent=s.phase==='question'?'ОТВЕЧАЙТЕ':'ПРОВЕРЯЕМ';$('round').textContent='Раунд '+q.round_position+' · '+q.round_title+' · Вопрос '+q.position;$('qtext').textContent=q.text;$('qimage').innerHTML=q.image?'<img class="screen-image" src="/media/'+q.image+'">':'';$('options').innerHTML=(q.options||[]).map((x,i)=>{const ok=s.phase!=='question' && ((Array.isArray(q.answer)?q.answer:[q.answer]).map(String).includes(String(x)));return '<div class="screen-option '+(ok?'correct':'')+'"><span>'+String.fromCharCode(65+i)+'</span><b>'+esc(x)+'</b></div>'}).join('');if(s.phase==='reveal'&&q.answer){$('explanation').hidden=false;$('explanation').innerHTML='<b>Правильный ответ: '+esc(Array.isArray(q.answer)?q.answer.join(', '):q.answer)+'</b><p>'+esc(q.explanation||'')+'</p>'}else $('explanation').hidden=true;$('timer').textContent=s.phase==='question'?Math.max(0,Math.ceil(s.deadline-Date.now()/1000))+'с':'ОТВЕТ'}
function showFinish(list){$('game').style.display='none';$('finish').hidden=false;const top=list.slice(0,3);$('podium').innerHTML=top.map((x,i)=>'<div class="podium-card"><span>#'+(i+1)+'</span><b>'+esc(x.team_name)+'</b><strong>'+x.score+'</strong></div>').join('');$('fullBoard').innerHTML=list.map((x,i)=>'<div class="board-row"><span>#'+(i+1)+'</span><b>'+esc(x.team_name)+'</b><strong>'+x.score+'</strong></div>').join('')}
async function poll(){try{const d=await api('/api/state');showQuestion(d);const rr=await api('/api/reactions?since='+lastReaction);for(const e of ['👍','😊','❤️','🔥']){const el=$('rc-'+e);if(el)el.textContent=String(rr.counts?.[e]||0)}for(const r of rr.reactions){lastReaction=r.id;const n=document.createElement('div');n.className='reaction-float';n.textContent=r.emoji;n.style.setProperty('--dx',(Math.random()*120-60)+'px');$('reactionLayer').appendChild(n);setTimeout(()=>n.remove(),1500)}}catch(e){console.error(e)}}poll();setInterval(poll,700);setInterval(async()=>{const d=await api('/api/state');if(d.state.phase==='question')$('timer').textContent=Math.max(0,Math.ceil(d.state.deadline-Date.now()/1000))+'с'},150)
</script></body></html>
