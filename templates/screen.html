<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Общий экран — Алхимик</title><link rel="stylesheet" href="/static/style.css"></head><body class="screen-body"><main class="screen"><div class="eyebrow">СТАНЦИЯ «АЛХИМИК» · СИНДРОМ ЭФИРИТА</div><div id="round" class="round"></div><h1 id="q">Подождите запуска</h1><div id="options" class="options"></div><div id="timer" class="timer">—</div><div id="reveal" class="reveal"></div></main><script>
let deadline=0;
async function refresh(){const r=await fetch('/api/state');const d=await r.json();const s=d.state,q=d.question;document.getElementById('round').textContent=q?('Раунд '+q.round+' · '+q.title):'';document.getElementById('q').textContent=q?q.question:(s.phase==='finished'?'Квиз завершён':'Подождите запуска');const o=document.getElementById('options');o.innerHTML='';if(q&&q.options&&q.options.length){q.options.forEach((x,i)=>{const e=document.createElement('div');e.className='option';e.textContent=(q.type==='choice'?String.fromCharCode(1040+i)+') ':'')+x;o.appendChild(e)})}if(s.phase==='question'){deadline=s.deadline;document.getElementById('reveal').textContent=''} else if(s.phase==='reveal'&&q){document.getElementById('reveal').innerHTML='<b>Ответ: '+esc(q.answer)+'</b><br>'+esc(q.explanation||'')} else document.getElementById('reveal').textContent=''; updateTimer(s)}
function updateTimer(s){const el=document.getElementById('timer');if(s.phase!=='question'){el.textContent=s.phase==='finished'?'ФИНИШ':'—';return}const left=Math.max(0,Math.ceil(s.deadline-Date.now()/1000_000*0+0));}
function tick(){fetch('/api/state').then(r=>r.json()).then(d=>{const s=d.state;const el=document.getElementById('timer');if(s.phase==='question'){const n=Math.max(0,Math.ceil(s.deadline-Date.now()/1000));el.textContent=n+' c';}else if(s.phase==='reveal')el.textContent='ОТВЕТ';else el.textContent=s.phase==='finished'?'ФИНИШ':'—';})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
refresh();setInterval(refresh,1000);setInterval(tick,250);
</script></body></html>
