<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Игрок — Алхимик</title><link rel="stylesheet" href="/static/style.css"></head><body class="player-body"><main class="player-shell">
<section id="joinView" class="player-card join-view"><div class="player-brand"><div class="brand-mark">A</div><div><strong>АЛХИМИК</strong><span>СИНДРОМ ЭФИРИТА</span></div></div><div class="eyebrow">ВХОД В КВИЗ</div><h1>Подключайтесь</h1><p class="lead">Введите код с общего экрана и название команды.</p><form onsubmit="join(event)" class="stack"><label>Код квиза<input id="room" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" required></label><label>Название команды<input id="team" maxlength="40" placeholder="Например, Геологи" required></label><button class="btn btn-primary">Войти в игру</button></form><div id="joinMsg" class="form-msg"></div></section>
<section id="gameView" class="player-card" hidden><div class="player-top"><div><span class="status-chip" id="statusChip">Ждём старта</span><strong id="teamLabel">—</strong></div><div class="player-timer" id="timer">—</div></div><div class="progress"><span id="progressBar"></span></div><div id="roundMeta" class="round-meta">—</div><h1 id="question">Ожидайте старта…</h1><div id="answerBox" class="answer-box"></div><button class="btn btn-primary wide" id="submitBtn" onclick="submitAnswer()">Ответить</button><div id="msg" class="form-msg"></div><div id="resultBox" class="result-box" hidden></div>
<div class="reaction-dock"><span>Реакции</span><button onclick="sendReaction('👍')">👍</button><button onclick="sendReaction('😊')">😊</button><button onclick="sendReaction('❤️')">❤️</button><button onclick="sendReaction('🔥')">🔥</button></div></section>
<section id="finishedView" class="player-card" hidden><div class="eyebrow">ИТОГИ</div><h1>Квиз завершён 🎉</h1><div class="final-score" id="finalScore">0</div><div class="final-label">баллов</div><div id="finalRank" class="rank-card"></div><div id="finalBoard" class="leaderboard-mobile"></div><button class="btn btn-secondary wide" onclick="location.reload()">Выйти</button></section>
</main>
<script>
const TOTAL={{ question_count }};let teamCode='';let currentIndex=-1;let currentQuestion=null;let answered=false;let roomParam=new URLSearchParams(location.search).get('code');if(roomParam)document.getElementById('room').value=roomParam;
async function api(url,opts){const r=await fetch(url,opts);const d=await r.json();if(!r.ok)throw new Error(d.message||'Ошибка');return d}
function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function show(id,on){document.getElementById(id).hidden=!on}
async function join(e){e.preventDefault();try{const fd=new FormData();fd.append('room_code',document.getElementById('room').value.trim());fd.append('team_name',document.getElementById('team').value.trim());const d=await api('/api/join',{method:'POST',body:fd});teamCode=d.team_code;localStorage.setItem('alch_team',teamCode);localStorage.setItem('alch_name',d.team_name);show('joinView',false);show('gameView',true);await refresh()}catch(e){document.getElementById('joinMsg').textContent=e.message}}
function renderInput(q,selected){const box=document.getElementById('answerBox');box.innerHTML='';if(q.type==='choice'||q.type==='bool'){q.options.forEach((x,i)=>{const letter=String.fromCharCode(65+i);const checked=selected===x?'checked':'';box.innerHTML+='<label class="player-option"><input type="radio" name="answer" value="'+esc(x)+'" '+checked+'><span class="option-letter">'+letter+'</span><span>'+esc(x)+'</span></label>'})}else{box.innerHTML='<input class="text-answer" id="textAnswer" placeholder="Ваш ответ" value="'+esc(selected||'')+'">'}}
function renderResult(d){const r=d.result;const box=document.getElementById('resultBox');if(!r){box.hidden=true;return;}box.hidden=false;const q=d.question;let html='<div class="result-title">'+(r.correct?'Правильно! 🎉':'Неверно')+'</div>';if(q.type==='choice'||q.type==='bool'){html+='<div class="review-options">'+q.options.map((x,i)=>{const cls=x===r.correct_answer?'correct':(x===r.submitted?'wrong':'');return '<div class="review-option '+cls+'"><span class="option-letter">'+String.fromCharCode(65+i)+'</span><strong>'+esc(x)+'</strong>'+(x===r.correct_answer?'<small>Правильный ответ</small>':'')+(x===r.submitted&&x!==r.correct_answer?'<small>Ваш ответ</small>':'')+'</div>'}).join('')+'</div>'}else{html+='<div class="result-option '+(r.correct?'correct':'wrong')+'"><span>Ваш ответ</span><strong>'+esc(r.submitted)+'</strong></div>';if(!r.correct)html+='<div class="result-option correct"><span>Правильный ответ</span><strong>'+esc(r.correct_answer)+'</strong></div>'}html+='<p>'+esc(r.explanation||'')+'</p>';box.innerHTML=html}
function renderLeaderboard(list,score){const sorted=list;const me=sorted.find(x=>x.team_code===teamCode);document.getElementById('finalScore').textContent=score;document.getElementById('finalRank').innerHTML=me?'<b>#'+(sorted.indexOf(me)+1)+'</b><span>'+esc(me.team_name)+'</span>':'';document.getElementById('finalBoard').innerHTML=sorted.map((x,i)=>'<div class="mobile-score '+(x.team_code===teamCode?'me':'')+'"><span>#'+(i+1)+'</span><strong>'+esc(x.team_name)+'</strong><b>'+x.score+'</b></div>').join('')}
async function refresh(){if(!teamCode)return;try{const d=await api('/api/team/'+teamCode);const s=d.state,q=d.question;document.getElementById('teamLabel').textContent=d.team.team_name;document.getElementById('roundMeta').textContent=q?'Раунд '+q.round+' · '+q.title+' · Вопрос '+(Math.min(s.q_index+1,TOTAL))+' / '+TOTAL:'';document.getElementById('timer').textContent=s.phase==='question'?Math.max(0,Math.ceil(s.deadline-Date.now()/1000))+'с':s.phase==='reveal'?'ОТВЕТ':'—';document.getElementById('statusChip').textContent=s.phase==='question'?'Играем':s.phase==='reveal'?'Проверка':'Ждём старта';if(s.phase==='finished'){show('gameView',false);show('finishedView',true);renderLeaderboard(d.leaderboard,d.team.score);return}show('gameView',true);show('finishedView',false);if(s.phase==='question'&&q){currentIndex=s.q_index;currentQuestion=q;answered=d.answered;document.getElementById('question').textContent=q.question;renderInput(q, d.answered?null:'');document.getElementById('submitBtn').disabled=answered;if(answered)document.getElementById('msg').textContent='Ответ принят. Ждём проверки.';else document.getElementById('msg').textContent='';document.getElementById('progressBar').style.width=((s.q_index+1)/TOTAL*100)+'%';document.getElementById('resultBox').hidden=true}else if(s.phase==='reveal'&&q){document.getElementById('question').textContent=q.question;document.getElementById('submitBtn').disabled=true;renderResult(d);document.getElementById('progressBar').style.width=((s.q_index+1)/TOTAL*100)+'%'}else{document.getElementById('question').textContent=s.phase==='waiting'?'Ведущий скоро запустит квиз':'Подготовка';document.getElementById('submitBtn').disabled=true;document.getElementById('answerBox').innerHTML=''}}catch(e){document.getElementById('msg').textContent=e.message}}
async function submitAnswer(){if(answered||!currentQuestion)return;let value='';if(currentQuestion.type==='text')value=document.getElementById('textAnswer')?.value||'';else{const r=document.querySelector('input[name="answer"]:checked');value=r?r.value:''}if(!value){document.getElementById('msg').textContent='Выберите или введите ответ.';return}try{const fd=new FormData();fd.append('team_code',teamCode);fd.append('q_index',String(currentIndex));fd.append('value',value);await api('/api/answer',{method:'POST',body:fd});answered=true;document.getElementById('submitBtn').disabled=true;document.getElementById('msg').textContent='Ответ принят. Ждём проверки.';await refresh()}catch(e){document.getElementById('msg').textContent=e.message}}
async function sendReaction(emoji){try{const fd=new FormData();fd.append('team_code',teamCode);fd.append('emoji',emoji);await api('/api/reaction',{method:'POST',body:fd});const btn=[...document.querySelectorAll('.reaction-dock button')].find(b=>b.textContent===emoji);if(btn){btn.classList.remove('pop');void btn.offsetWidth;btn.classList.add('pop')}}catch(e){}}
const saved=localStorage.getItem('alch_team');if(saved){teamCode=saved;show('joinView',false);show('gameView',true);refresh()}setInterval(refresh,1000);setInterval(()=>{if(teamCode&&document.getElementById('gameView').hidden===false)api('/api/team/'+teamCode).then(d=>{if(d.state.phase==='question')document.getElementById('timer').textContent=Math.max(0,Math.ceil(d.state.deadline-Date.now()/1000))+'с'}).catch(()=>{})},250)
</script></body></html>
