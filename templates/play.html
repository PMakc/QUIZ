<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Игроки — Алхимик</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="shell"><div class="panel"><div class="eyebrow">ИГРОК</div><h1>Квиз «Алхимик»</h1><section id="join"><p>Введите код комнаты с общего экрана и название команды.</p><form onsubmit="join(event)"><input id="room" required placeholder="ALCH-AB12"><input id="team" required placeholder="Название команды"><button class="btn">Подключиться</button></form><div id="joinMsg" class="muted"></div></section><section id="game" hidden><div class="toolbar"><span id="teamLabel" class="pill"></span><span id="timer" class="timer small"></span></div><div class="qnum" id="qnum"></div><h2 id="question"></h2><div id="answerBox"></div><button class="btn" id="submitBtn" onclick="submitAnswer()">Ответить</button><div id="msg" class="muted"></div></section></div></main><script>
let teamCode='', currentIndex=-1, currentQuestion=null, answered=false;let roomParam=new URLSearchParams(location.search).get('code');if(roomParam)document.getElementById('room').value=roomParam;
async function api(url, options){const r=await fetch(url, options);const d=await r.json();if(!r.ok)throw new Error(d.message||'Ошибка');return d;}
async function join(e){e.preventDefault();const fd=new FormData();fd.append('room_code',document.getElementById('room').value);fd.append('team_name',document.getElementById('team').value);try{const d=await api('/api/join',{method:'POST',body:fd});teamCode=d.team_code;localStorage.setItem('alch_team',teamCode);localStorage.setItem('alch_name',d.team_name);document.getElementById('join').hidden=true;document.getElementById('game').hidden=false;await refresh();}catch(e){document.getElementById('joinMsg').textContent=e.message;}}
async function refresh(){if(!teamCode)return;try{const d=await api('/api/team/'+teamCode);const s=d.state,q=d.question;document.getElementById('teamLabel').textContent=d.team.team_name+' · '+d.team.score+' очк.';if(s.phase==='question'&&q){currentIndex=s.q_index;currentQuestion=q;answered=d.answered;document.getElementById('qnum').textContent='Вопрос '+(s.q_index+1)+' / 17 · Раунд '+q.round+' · '+q.title;document.getElementById('question').textContent=q.question;renderInput(q);document.getElementById('submitBtn').disabled=answered;document.getElementById('msg').textContent=answered?'Ответ принят. Ждём остальные команды.':'';}else if(s.phase==='reveal'&&q){document.getElementById('answerBox').innerHTML='<div class="answer">Ответ: '+esc(q.answer)+'</div><div class="muted">'+esc(q.explanation||'')+'</div>';document.getElementById('submitBtn').disabled=true;}else if(s.phase==='finished'){document.getElementById('qnum').textContent='Квиз завершён';document.getElementById('question').textContent='Спасибо!';document.getElementById('answerBox').innerHTML='';document.getElementById('submitBtn').disabled=true;document.getElementById('msg').textContent='Итог: '+d.team.score+' очков.';}else{document.getElementById('question').textContent='Ожидайте запуска...';document.getElementById('submitBtn').disabled=true;}}
catch(e){document.getElementById('msg').textContent=e.message;}}
function renderInput(q){const box=document.getElementById('answerBox');box.innerHTML='';if(q.type==='choice'||q.type==='bool'){q.options.forEach(x=>{const label=document.createElement('label');label.className='choice';label.innerHTML='<input type="radio" name="answer" value="'+escAttr(x)+'"><span>'+esc(x)+'</span>';box.appendChild(label)});}else{const input=document.createElement('input');input.id='textAnswer';input.placeholder='Введите ответ';box.appendChild(input);}}
async function submitAnswer(){if(answered||!currentQuestion)return;let value='';if(currentQuestion.type==='text')value=document.getElementById('textAnswer').value;else{const r=document.querySelector('input[name="answer"]:checked');value=r?r.value:'';}if(!value){document.getElementById('msg').textContent='Выберите или введите ответ.';return;}const fd=new FormData();fd.append('team_code',teamCode);fd.append('q_index',String(currentIndex));fd.append('value',value);try{const d=await api('/api/answer',{method:'POST',body:fd});answered=true;document.getElementById('submitBtn').disabled=true;document.getElementById('msg').textContent='Ответ принят.';await refresh();}catch(e){document.getElementById('msg').textContent=e.message;}}
function tick(){if(!teamCode)return;fetch('/api/team/'+teamCode).then(r=>r.json()).then(d=>{if(d.state.phase==='question'){document.getElementById('timer').textContent=Math.max(0,Math.ceil(d.state.deadline-Date.now()/1000))+' c';}else document.getElementById('timer').textContent=d.state.phase==='finished'?'ФИНИШ':'—';});}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function escAttr(s){return esc(s)}
const savedTeam=localStorage.getItem('alch_team');if(savedTeam){teamCode=savedTeam;localStorage.removeItem('alch_team');localStorage.removeItem('alch_name');document.getElementById('join').hidden=true;document.getElementById('game').hidden=false;refresh();}
setInterval(refresh,1000);setInterval(tick,250);
</script></body></html>
