<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Игрок — {{ settings.title }}</title><link rel="stylesheet" href="/static/style.css"></head><body class="player"><main class="player-wrap"><section id="join" class="player-card"><div class="logo-badge">Q</div><div class="eyebrow">{{ settings.subtitle }}</div><h1>{{ settings.title }}</h1><p class="lead">Введите код с экрана и название команды.</p><form id="joinForm"><label>Код квиза<input id="roomInput" inputmode="numeric" required></label><label>Название команды<input id="teamInput" maxlength="40" required></label><button class="btn btn-primary wide">Войти</button></form><div id="joinMsg" class="form-msg"></div></section><section id="game" class="player-card" hidden><div class="player-bar"><div><span id="status" class="chip">Ждём старта</span><b id="teamName">—</b></div><div id="timer" class="player-timer">—</div></div><div id="round" class="muted">—</div><h1 id="question">Ожидание…</h1><div id="image"></div><div id="answerBox" class="answer-box"></div><button id="send" class="btn btn-primary wide" onclick="submitAnswer()">Ответить</button><div id="msg" class="form-msg"></div><div id="result" hidden></div><div class="reaction-dock"><span>Реакции</span><button onclick="react('👍')">👍</button><button onclick="react('😊')">😊</button><button onclick="react('❤️')">❤️</button><button onclick="react('🔥')">🔥</button></div></section><section id="finish" class="player-card" hidden><div class="eyebrow">ИТОГИ</div><h1>Квиз завершён 🎉</h1><div id="myScore" class="final-score">0</div><div class="muted center">баллов</div><div id="rank" class="rank-card"></div><div id="board" class="mobile-board"></div></section></main>
<script>
let teamCode=localStorage.getItem('alch_team')||'';let qid=null;let answered=false;const $=id=>document.getElementById(id);const savedCode=new URLSearchParams(location.search).get('code');if(savedCode)$('roomInput').value=savedCode;
async function api(u,o){const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw new Error(d.message||'Ошибка');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(id,on){$(id).hidden=!on}
$('joinForm').onsubmit=async e=>{e.preventDefault();try{const f=new FormData();f.append('room_code',$('roomInput').value.trim());f.append('team_name',$('teamInput').value.trim());const d=await api('/api/join',{method:'POST',body:f});teamCode=d.team_code;localStorage.setItem('alch_team',teamCode);show('join',false);show('game',true);refresh()}catch(e){$('joinMsg').textContent=e.message}};
function renderAnswers(q,selected){const b=$('answerBox');b.innerHTML='';if(q.type==='text'){b.innerHTML='<input id="textAnswer" class="text-answer" placeholder="Ваш ответ">';return}q.options.forEach((x,i)=>{const checked=(q.type==='multiple'?(selected||[]).includes(x):selected===x);b.innerHTML+='<label class="player-option '+(checked?'selected':'')+'"><input type="'+(q.type==='multiple'?'checkbox':'radio')+'" name="ans" value="'+esc(x)+'" '+(checked?'checked':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(x)+'</span></label>'})}
function getSelected(q){if(q.type==='text')return $('textAnswer')?.value||'';const xs=[...document.querySelectorAll('input[name=ans]:checked')].map(x=>x.value);return q.type==='multiple'?JSON.stringify(xs):xs[0]||''}
function renderResult(d){const r=d.result,q=d.question;if(!r){$('result').hidden=true;return}let html='<div class="result-head '+(r.correct?'good':'bad')+'">'+(r.correct?'Правильно! 🎉':'Неверно')+'</div>';if(q.type!=='text'){html+='<div class="review">'+q.options.map((x,i)=>{const correct=(Array.isArray(r.correct_answer)?r.correct_answer:[r.correct_answer]).includes(x);let mine=false;try{mine=q.type==='multiple'?(r.submitted_list||[]).includes(x):r.submitted===x}catch{}return '<div class="review-item '+(correct?'good ':'')+(mine&&!correct?'bad':'')+'"><span>'+String.fromCharCode(65+i)+'</span><b>'+esc(x)+'</b></div>'}).join('')+'</div>'}else{html+='<div class="review-item '+(r.correct?'good':'bad')+'"><span>Ваш ответ</span><b>'+esc(r.submitted)+'</b></div>';if(!r.correct)html+='<div class="review-item good"><span>Правильный</span><b>'+esc(r.correct_answer)+'</b></div>'}html+='<p>'+esc(r.explanation||'')+'</p>';$('result').innerHTML=html;$('result').hidden=false}
async function refresh(){if(!teamCode)return;try{const d=await api('/api/team/'+teamCode);$('teamName').textContent=d.team.team_name;if(d.state.phase==='finished'){show('game',false);show('join',false);show('finish',true);$('myScore').textContent=d.team.score;const me=d.leaderboard.find(x=>x.team_code===teamCode);$('rank').innerHTML=me?'<b>#'+(d.leaderboard.indexOf(me)+1)+'</b><span>'+esc(me.team_name)+'</span>':'';$('board').innerHTML=d.leaderboard.map((x,i)=>'<div class="board-row '+(x.team_code===teamCode?'me':'')+'"><span>#'+(i+1)+'</span><b>'+esc(x.team_name)+'</b><strong>'+x.score+'</strong></div>').join('');return}show('finish',false);show('game',true);const q=d.question;if(!q){$('status').textContent='Ждём старта';$('question').textContent='Ведущий скоро начнёт квиз';$('answerBox').innerHTML='';$('send').disabled=true;return}qid=q.id;$('round').textContent='Раунд '+q.round_position+' · '+q.round_title+' · Вопрос '+q.position;$('question').textContent=q.text;$('image').innerHTML=q.image?'<img class="player-image" src="/media/'+q.image+'">':'';if(d.state.phase==='question'){if(qid!==window.lastQ){answered=false;window.lastQ=qid;$('result').hidden=true;$('msg').textContent=''}const sel=d.answered&&d.result?(q.type==='multiple'?(d.result.submitted_list||[]):d.result.submitted):undefined;renderAnswers(q,sel);answered=!!d.answered;$('send').disabled=d.answered;$('status').textContent='Отвечайте';$('timer').textContent=Math.max(0,Math.ceil(d.state.deadline-Date.now()/1000))+'с'}else if(d.state.phase==='reveal'){if(!d.answered){$('answerBox').innerHTML='<div class="waiting-answer">Вы не ответили на этот вопрос.</div>'}$('send').disabled=true;$('status').textContent='Ответ открыт';renderResult(d);$('timer').textContent='ОТВЕТ'}}catch(e){$('msg').textContent=e.message}}
async function submitAnswer(){if(answered)return;const d=await api('/api/team/'+teamCode);const q=d.question;if(!q)return;const value=getSelected(q);if(!value){$('msg').textContent='Выберите или введите ответ.';return}try{const f=new FormData();f.append('team_code',teamCode);f.append('question_id',String(q.id));f.append('value',value);await api('/api/answer',{method:'POST',body:f});answered=true;$('send').disabled=true;$('msg').textContent='Ответ принят';refresh()}catch(e){$('msg').textContent=e.message}}
async function react(emoji){const f=new FormData();f.append('team_code',teamCode);f.append('emoji',emoji);await fetch('/api/reaction',{method:'POST',body:f});}
if(teamCode){show('join',false);show('game',true);refresh()}setInterval(refresh,900);setInterval(()=>{if(teamCode)api('/api/team/'+teamCode).then(d=>{if(d.state.phase==='question')$('timer').textContent=Math.max(0,Math.ceil(d.state.deadline-Date.now()/1000))+'с'}).catch(()=>{})},150)
</script></body></html>
