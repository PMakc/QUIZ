<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Игрок — {{ settings.title }}</title><link rel="stylesheet" href="/static/style.css"></head><body class="player-page"><main class="player-wrap"><section id="join" class="player-card"><div class="logo">Q</div><div class="eyebrow">{{ settings.subtitle }}</div><h1>{{ settings.title }}</h1><p>Введите код с общего экрана и название команды.</p><form id="joinForm" class="form-stack"><label>Код квиза<input id="roomInput" inputmode="numeric" required></label><label>Название команды<input id="teamInput" maxlength="40" required></label><button class="btn primary">Войти</button></form><div id="joinMsg" class="msg"></div></section><section id="game" class="player-card" hidden><div class="player-head"><div><span id="status" class="chip">Ждём старта</span><b id="teamName">—</b></div><strong id="timer" class="ptimer">—</strong></div><div id="round" class="muted"></div><h2 id="question">Ожидание…</h2><div id="image"></div><div id="answers" class="answer-list"></div><div id="stats" class="answer-stats"></div><button id="send" class="btn primary wide" type="button">Ответить</button><div id="msg" class="msg"></div><div id="result" hidden></div><div class="reaction-dock"><span>Реакции</span><button type="button" onclick="react('👍')">👍 <i id="rc-👍">0</i></button><button type="button" onclick="react('😊')">😊 <i id="rc-😊">0</i></button><button type="button" onclick="react('❤️')">❤️ <i id="rc-❤️">0</i></button><button type="button" onclick="react('🔥')">🔥 <i id="rc-🔥">0</i></button></div></section><section id="finish" class="player-card" hidden><div class="eyebrow">ИТОГИ</div><h2>Квиз завершён 🎉</h2><div class="final-score" id="myScore">0</div><div class="center muted">баллов</div><div id="rank" class="rank"></div><div id="board" class="mobile-board"></div></section></main><script>
const $=id=>document.getElementById(id);let teamCode=localStorage.getItem('alch_team')||'';let currentId=null,currentQuestion=null,currentPhase='waiting',answered=false;
const code=new URLSearchParams(location.search).get('code');if(code)$('roomInput').value=code;
async function api(u,o={}){let r;try{r=await fetch(u,o)}catch{throw new Error('Нет связи с сервером.')}let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.message||('Ошибка HTTP '+r.status));e.status=r.status;throw e}return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(id,on){$(id).hidden=!on}
function clearTeam(){teamCode='';localStorage.removeItem('alch_team');currentId=null;currentQuestion=null;answered=false;show('game',false);show('finish',false);show('join',true);$('joinMsg').textContent='Старая сессия завершена. Подключитесь к новой игре.';loadRoom()}
async function loadRoom(){try{$('roomInput').value=(await api('/api/state')).state.room_code}catch{}}
$('joinForm').onsubmit=async e=>{e.preventDefault();$('joinMsg').textContent='';try{const f=new FormData();f.append('room_code',$('roomInput').value.trim());f.append('team_name',$('teamInput').value.trim());const d=await api('/api/join',{method:'POST',body:f});teamCode=d.team_code;localStorage.setItem('alch_team',teamCode);show('join',false);show('game',true);show('finish',false);await refresh()}catch(e){$('joinMsg').textContent=e.message}};
function selected(){if(!currentQuestion)return '';if(currentQuestion.type==='text')return $('textAnswer')?.value||'';const v=[...document.querySelectorAll('input[name=ans]:checked')].map(x=>x.value);return currentQuestion.type==='multiple'?JSON.stringify(v):(v[0]||'')}
function updateClasses(){document.querySelectorAll('.answer-btn').forEach(x=>{const i=x.querySelector('input');x.classList.toggle('selected',!!i?.checked)})}
function renderAnswers(q,selected){const box=$('answers');box.innerHTML='';if(q.type==='text'){box.innerHTML='<input id="textAnswer" class="text-answer" placeholder="Введите ответ" autocomplete="off">';if(typeof selected==='string')$('textAnswer').value=selected;return}const chosen=q.type==='multiple'?(Array.isArray(selected)?selected:[]):[];(q.options||[]).forEach((o,i)=>{const lab=document.createElement('label');lab.className='answer-btn'+((q.type==='multiple'?chosen.includes(o):selected===o)?' selected':'');lab.innerHTML=`<input type="${q.type==='multiple'?'checkbox':'radio'}" name="ans" value="${esc(o)}"><span>${String.fromCharCode(65+i)}</span><b>${esc(o)}</b>`;const input=lab.querySelector('input');input.checked=q.type==='multiple'?chosen.includes(o):selected===o;input.onchange=updateClasses;box.appendChild(lab)})}
function showStats(stats,q){const box=$('stats');box.innerHTML='';if(!stats?.total||!q?.options?.length)return;box.innerHTML=stats.options.map(o=>`<div class="stat-item"><div><span>${esc(o.option)}</span><b>${o.percent}%</b></div><div class="statbar"><i style="width:${o.percent}%"></i></div></div>`).join('')}
function showResult(d){const r=d.result,q=d.question;if(!r){$('result').hidden=true;return}const right=new Set((Array.isArray(r.correct_answer)?r.correct_answer:[r.correct_answer]).map(String));const mine=new Set((r.submitted_list||[]).map(String));document.querySelectorAll('#answers .answer-btn').forEach(btn=>{const input=btn.querySelector('input');const val=input?.value||'';btn.classList.remove('result-good','result-bad','selected');if(right.has(String(val)))btn.classList.add('result-good');if(mine.has(String(val))&&!right.has(String(val)))btn.classList.add('result-bad');});let html=`<div class="result-title ${r.correct?'good':'bad'}">${r.correct?'Правильно! 🎉':'Неверно'}</div>`;if(q.type==='text'){html+=`<div class="review-option ${r.correct?'good':'bad'}"><b>Ваш ответ: ${esc(r.submitted)}</b></div>`;if(!r.correct)html+=`<div class="review-option good"><b>Правильный ответ: ${esc(r.correct_answer)}</b></div>`}html+='<p class="muted">Правильный вариант подсвечен зелёным, ошибочно выбранный — красным.</p>';$('result').innerHTML=html;$('result').hidden=false}
function counts(c){for(const e of ['👍','😊','❤️','🔥'])$('rc-'+e).textContent=c?.[e]||0}
async function refresh(){if(!teamCode)return;try{const d=await api('/api/team/'+encodeURIComponent(teamCode));$('teamName').textContent=d.team.team_name;counts(d.reaction_counts);if(d.state.phase==='finished'){show('game',false);show('join',false);show('finish',true);$('myScore').textContent=d.team.score;const me=d.leaderboard.find(x=>x.team_code===teamCode);$('rank').innerHTML=me?`<b>#${d.leaderboard.indexOf(me)+1}</b><span>${esc(me.team_name)}</span>`:'';$('board').innerHTML=d.leaderboard.map((x,i)=>`<div class="board-row ${x.team_code===teamCode?'me':''}"><span>#${i+1}</span><b>${esc(x.team_name)}</b><strong>${x.score}</strong></div>`).join('');return}show('finish',false);show('game',true);const q=d.question;if(!q){currentQuestion=null;currentId=null;answered=false;$('status').textContent='Ждём старта';$('question').textContent='Ведущий скоро начнёт квиз';$('answers').innerHTML='';$('stats').innerHTML='';$('send').disabled=true;return}const changed=currentId!==q.id;const phaseChanged=currentPhase!==d.state.phase;currentPhase=d.state.phase;currentQuestion=q;$('round').textContent='Раунд '+q.round_position+' · '+q.round_title+' · Вопрос '+q.position;$('question').textContent=q.text;$('image').innerHTML=q.image?`<img class="player-image" src="/media/${q.image}">`:'';if(d.state.phase==='question'){if(changed){currentId=q.id;answered=!!d.answered;let sel=d.answered&&d.result?(q.type==='multiple'?d.result.submitted_list:d.result.submitted):null;renderAnswers(q,sel);$('result').hidden=true;$('msg').textContent=''}else if(d.answered)answered=true;document.querySelectorAll('#answers input,#answers button').forEach(x=>x.disabled=answered);$('send').disabled=answered;$('status').textContent=answered?'Ответ принят':'Выберите ответ';$('timer').textContent=Math.max(0,Math.ceil((d.state.deadline*1000-Date.now())/1000))+'с';if(answered)showStats(d.stats,q);else $('stats').innerHTML=''}else if(d.state.phase==='reveal'){answered=!!d.answered;document.querySelectorAll('#answers input').forEach(x=>x.disabled=true);$('send').disabled=true;$('status').textContent='Результат';showStats(d.stats,q);showResult(d);$('timer').textContent='ОТВЕТ';if(!d.answered)$('answers').innerHTML='<div class="no-answer">Вы не ответили</div>'}else{$('send').disabled=true}$('send').disabled=answered||d.state.phase!=='question'}catch(e){if(e.status===404){clearTeam();return}$('msg').textContent=e.message}}
$('send').onclick=async()=>{if(answered||!currentQuestion)return;const val=selected();if(!val||val==='[]'){$('msg').textContent='Выберите ответ.';return}$('send').disabled=true;document.querySelectorAll('#answers input').forEach(x=>x.disabled=true);$('msg').textContent='Ответ принят…';try{const f=new FormData();f.append('team_code',teamCode);f.append('question_id',currentQuestion.id);f.append('value',val);const d=await api('/api/answer',{method:'POST',body:f});answered=true;showStats(d.stats,currentQuestion);$('msg').textContent='Ответ принят';counts(d.reaction_counts);await refresh()}catch(e){if(e.status===404){clearTeam();return}if(e.status===409){answered=true;$('msg').textContent=e.message;await refresh();return}$('send').disabled=false;document.querySelectorAll('#answers input').forEach(x=>x.disabled=false);$('msg').textContent=e.message}};
async function react(e){const f=new FormData();f.append('team_code',teamCode);f.append('emoji',e);try{const d=await api('/api/reaction',{method:'POST',body:f});$("rc-"+e).textContent=d.count}catch(x){if(x.status===404)clearTeam()}}
(async()=>{if(teamCode){show('join',false);show('game',true);await refresh()}else{show('join',true);show('game',false);await loadRoom()}})();setInterval(refresh,1000);setInterval(()=>{if(teamCode)api('/api/reactions?since=0').then(d=>counts(d.counts)).catch(()=>{})},1500)
</script></body></html>
