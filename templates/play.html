<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Игрок — {{ settings.title }}</title><link rel="stylesheet" href="/static/style.css"></head><body class="player"><main class="player-wrap"><section id="join" class="player-card"><div class="logo-badge">Q</div><div class="eyebrow">{{ settings.subtitle }}</div><h1>{{ settings.title }}</h1><p class="lead">Введите код с экрана и название команды.</p><form id="joinForm"><label>Код квиза<input id="roomInput" inputmode="numeric" required></label><label>Название команды<input id="teamInput" maxlength="40" required></label><button class="btn btn-primary wide">Войти</button></form><div id="joinMsg" class="form-msg"></div></section><section id="game" class="player-card" hidden><div class="player-bar"><div><span id="status" class="chip">Ждём старта</span><b id="teamName">—</b></div><div id="timer" class="player-timer">—</div></div><div id="round" class="muted">—</div><h1 id="question">Ожидание…</h1><div id="image"></div><div id="answerBox" class="answer-box"></div><button id="send" class="btn btn-primary wide" type="button">Ответить</button><div id="msg" class="form-msg"></div><div id="result" hidden></div><div class="reaction-dock"><span>Реакции</span><button type="button" onclick="react('👍')">👍 <i id="count-👍">0</i></button><button type="button" onclick="react('😊')">😊 <i id="count-😊">0</i></button><button type="button" onclick="react('❤️')">❤️ <i id="count-❤️">0</i></button><button type="button" onclick="react('🔥')">🔥 <i id="count-🔥">0</i></button></div></section><section id="finish" class="player-card" hidden><div class="eyebrow">ИТОГИ</div><h1>Квиз завершён 🎉</h1><div id="myScore" class="final-score">0</div><div class="muted center">баллов</div><div id="rank" class="rank-card"></div><div id="board" class="mobile-board"></div></section></main>
<script>
const $=id=>document.getElementById(id);let teamCode=localStorage.getItem('alch_team')||'';let currentQuestion=null,currentPhase='waiting',currentQuestionId=null,answered=false;
const params=new URLSearchParams(location.search);const urlRoom=params.get('code')||'';if(urlRoom)$('roomInput').value=urlRoom;
async function api(url,opts={}){let r;try{r=await fetch(url,opts)}catch{throw new Error('Не удалось связаться с сервером. Проверьте соединение и попробуйте ещё раз.')}let d={};try{d=await r.json()}catch{d={message:'Сервер вернул некорректный ответ ('+r.status+').'}}if(!r.ok){const e=new Error(d.message||('Ошибка HTTP '+r.status));e.status=r.status;throw e}return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(id,on){$(id).hidden=!on}
async function refreshRoomCode(){try{const d=await api('/api/state');$('roomInput').value=d.state.room_code}catch{}}
function clearSavedTeam(){teamCode='';localStorage.removeItem('alch_team');currentQuestion=null;currentQuestionId=null;answered=false;show('game',false);show('finish',false);show('join',true);$('teamName').textContent='—';$('joinMsg').textContent='Сессия сброшена. Подключитесь к новой игре.';refreshRoomCode()}
$('joinForm').onsubmit=async e=>{e.preventDefault();$('joinMsg').textContent='';try{const f=new FormData();f.append('room_code',$('roomInput').value.trim());f.append('team_name',$('teamInput').value.trim());const d=await api('/api/join',{method:'POST',body:f});teamCode=d.team_code;localStorage.setItem('alch_team',teamCode);show('join',false);show('game',true);show('finish',false);answered=false;currentQuestionId=null;await refresh()}catch(e){$('joinMsg').textContent=e.message}};
function selectedValues(q){if(!q)return '';if(q.type==='text')return $('textAnswer')?.value||'';const xs=[...document.querySelectorAll('input[name="ans"]:checked')].map(x=>x.value);return q.type==='multiple'?JSON.stringify(xs):(xs[0]||'')}
function updateSelectedClasses(){document.querySelectorAll('.player-option').forEach(el=>{const input=el.querySelector('input');el.classList.toggle('selected',!!input?.checked)})}
function renderAnswers(q,selected){const b=$('answerBox');b.innerHTML='';if(q.type==='text'){b.innerHTML='<input id="textAnswer" class="text-answer" placeholder="Ваш ответ" autocomplete="off">';if(typeof selected==='string')$('textAnswer').value=selected;return}const list=q.type==='multiple'?(Array.isArray(selected)?selected:[]):[];q.options.forEach((x,i)=>{const checked=q.type==='multiple'?list.includes(x):selected===x;const type=q.type==='multiple'?'checkbox':'radio';const label=document.createElement('label');label.className='player-option'+(checked?' selected':'');label.innerHTML='<input type="'+type+'" name="ans" value="'+esc(x)+'" '+(checked?'checked':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(x)+'</span>';label.addEventListener('click',()=>setTimeout(updateSelectedClasses,0));b.appendChild(label)})}
function renderResult(d){const r=d.result,q=d.question;if(!r){$('result').hidden=true;return}let html='<div class="result-head '+(r.correct?'good':'bad')+'">'+(r.correct?'Правильно! 🎉':'Неверно')+'</div>';if(q.type!=='text'){const correctSet=new Set((Array.isArray(r.correct_answer)?r.correct_answer:[r.correct_answer]).map(String));const mineSet=new Set((r.submitted_list||[]).map(String));html+='<div class="review">'+q.options.map((x,i)=>{const correct=correctSet.has(String(x));const mine=mineSet.has(String(x));return '<div class="review-item '+(correct?'good ':'')+(mine&&!correct?'bad':'')+'"><span>'+String.fromCharCode(65+i)+'</span><b>'+esc(x)+'</b></div>'}).join('')+'</div>'}else{html+='<div class="review-item '+(r.correct?'good':'bad')+'"><span>Ваш ответ</span><b>'+esc(r.submitted)+'</b></div>';if(!r.correct)html+='<div class="review-item good"><span>Правильный</span><b>'+esc(r.correct_answer)+'</b></div>'}html+='<p>'+esc(r.explanation||'')+'</p>';$('result').innerHTML=html;$('result').hidden=false}
function updateReactionCounts(counts){for(const e of ['👍','😊','❤️','🔥']){const el=$('count-'+e);if(el)el.textContent=String(counts?.[e]||0)}}
async function refresh(){if(!teamCode)return;try{const d=await api('/api/team/'+encodeURIComponent(teamCode));$('teamName').textContent=d.team.team_name;if(d.state.phase==='finished'){show('game',false);show('join',false);show('finish',true);$('myScore').textContent=d.team.score;const me=d.leaderboard.find(x=>x.team_code===teamCode);$('rank').innerHTML=me?'<b>#'+(d.leaderboard.indexOf(me)+1)+'</b><span>'+esc(me.team_name)+'</span>':'';$('board').innerHTML=d.leaderboard.map((x,i)=>'<div class="board-row '+(x.team_code===teamCode?'me':'')+'"><span>#'+(i+1)+'</span><b>'+esc(x.team_name)+'</b><strong>'+x.score+'</strong></div>').join('');return}show('finish',false);show('game',true);const q=d.question;if(!q){currentQuestion=null;currentQuestionId=null;answered=false;$('status').textContent='Ждём старта';$('question').textContent='Ведущий скоро начнёт квиз';$('answerBox').innerHTML='';$('send').disabled=true;return}const questionChanged=currentQuestionId!==q.id;const phaseChanged=currentPhase!==d.state.phase;currentPhase=d.state.phase;window.lastDeadline=(d.state.deadline||0)*1000;$('round').textContent='Раунд '+q.round_position+' · '+q.round_title+' · Вопрос '+q.position;$('question').textContent=q.text;$('image').innerHTML=q.image?'<img class="player-image" src="/media/'+q.image+'">':'';if(d.state.phase==='question'){if(questionChanged){currentQuestionId=q.id;currentQuestion=q;answered=!!d.answered;$('result').hidden=true;$('msg').textContent='';let selected;if(d.answered&&d.result)selected=q.type==='multiple'?(d.result.submitted_list||[]):d.result.submitted;renderAnswers(q,selected)}else if(d.answered&&!answered){answered=true}$('send').disabled=answered;$('status').textContent=answered?'Ответ принят':'Отвечайте';$('timer').textContent=Math.max(0,Math.ceil((d.state.deadline*1000-Date.now())/1000))+'с'}else if(d.state.phase==='reveal'){currentQuestionId=q.id;currentQuestion=q;answered=!!d.answered;$('send').disabled=true;$('status').textContent='Ответ открыт';renderResult(d);$('timer').textContent='ОТВЕТ';if(!d.answered)$('answerBox').innerHTML='<div class="waiting-answer">Вы не ответили на этот вопрос.</div>'}if(phaseChanged&&d.state.phase==='question'&&!questionChanged)renderAnswers(q)}catch(e){if(e.status===404){clearSavedTeam();return}$('msg').textContent=e.message}}
$('send').onclick=async()=>{if(answered||!currentQuestion)return;const value=selectedValues(currentQuestion);if(!value||value==='[]'){$('msg').textContent='Выберите или введите ответ.';return}$('send').disabled=true;$('msg').textContent='Отправляем…';try{const f=new FormData();f.append('team_code',teamCode);f.append('question_id',String(currentQuestion.id));f.append('value',value);const d=await api('/api/answer',{method:'POST',body:f});answered=true;$('msg').textContent=d.correct?'Ответ принят ✓':'Ответ принят';await refresh()}catch(e){$('send').disabled=answered;if(e.status===404){clearSavedTeam();return}$('msg').textContent=e.message}};
async function react(emoji){const f=new FormData();f.append('team_code',teamCode);f.append('emoji',emoji);try{const d=await api('/api/reaction',{method:'POST',body:f});const el=$('count-'+emoji);if(el&&d.count!=null)el.textContent=String(d.count)}catch(e){if(e.status===404)clearSavedTeam()}}
(async()=>{if(teamCode){show('join',false);show('game',true);await refresh()}else{show('join',true);show('game',false);await refreshRoomCode()}})();setInterval(refresh,900);setInterval(()=>{if(teamCode&&currentPhase==='question')$('timer').textContent=Math.max(0,Math.ceil(((window.lastDeadline||Date.now())-Date.now())/1000))+'с'},250);setInterval(async()=>{try{const d=await api('/api/reactions?since=0');updateReactionCounts(d.counts)}catch{}},1500);
</script></body></html>
